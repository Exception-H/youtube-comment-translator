name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public source
        run: node scripts/audit-public.cjs
      - name: Test
        run: npm test
      - name: Check extension resources and syntax
        run: npm run check
